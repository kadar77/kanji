<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Kanji">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c66c42"/>
      <stop offset="1" stop-color="#a0472a"/>
    </linearGradient>
  </defs>
  <!-- Sumi-on-paper inverted: a warm terracotta ink tile with a cream 字 -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="10.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="24" y="25" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif"
        font-size="30" font-weight="600" fill="#f7efe1">字</text>
</svg>
